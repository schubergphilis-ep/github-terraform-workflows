# Example caller workflow for Terraform module CI.
# Place this in your module repository at .github/workflows/ci.yaml

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  Commit:
    uses: schubergphilis-ep/github-terraform-workflows/.github/workflows/commit.yaml@v1.0.0 # v1.0.0 - abc1234
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit

  Terraform:
    uses: schubergphilis-ep/github-terraform-workflows/.github/workflows/module-ci.yaml@v1.0.0 # v1.0.0 - abc1234
    permissions:
      contents: write
      security-events: write
    secrets: inherit
    # To authenticate against a private Terraform module registry during init, replace the
    # `secrets: inherit` line above with:
    # with:
    #   tf_registry_host: app.terraform.io
    # secrets:
    #   tf_registry_token: ${{ secrets.YOUR_TF_TOKEN_SECRET }}
