name: Module Release

on:
  workflow_call:
    inputs:
      config-file:
        description: 'Path to release-please config file'
        required: false
        type: string
        default: '.github/release-please-config.json'
      manifest-file:
        description: 'Path to release-please manifest file'
        required: false
        type: string
        default: '.github/.release-please-manifest.json'
      sbom:
        description: 'Attach a CycloneDX SBOM (sbom.cdx.json) to each release, built from the tracked .terraform.lock.hcl and the pinned actions in .github/workflows'
        required: false
        type: boolean
        default: false
    secrets:
      token:
        description: 'Token to use instead of GITHUB_TOKEN. A PAT is recommended so that releases created by release-please can trigger downstream workflows.'
        required: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 #v5.0.0
        id: release
        with:
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          token: ${{ secrets.token || secrets.GITHUB_TOKEN }}

  sbom:
    name: SBOM
    needs: release-please
    if: inputs.sbom && needs.release-please.outputs.releases_created == 'true' && needs.release-please.outputs.tag_name != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Generate SBOM
        id: generate
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ ! -f .terraform.lock.hcl ]; then
            echo "::notice::No .terraform.lock.hcl tracked, skipping SBOM"
            exit 0
          fi
          python3 - <<'PY'
          import glob, json, os, re
          PROVIDER = re.compile(r'provider "([^"]+)" \{(.*?)\n\}', re.S)
          USES = re.compile(r'uses:\s*([\w.-]+/[\w.-]+)(?:/[^@\s]*)?@([0-9a-f]{40})\s*(?:#\s*(\S+))?')
          repo, tag = os.environ["REPO"], os.environ["TAG"]
          owner, name = repo.split("/")
          components = {}
          for addr, body in PROVIDER.findall(open(".terraform.lock.hcl").read()):
              version = re.search(r'version\s*=\s*"([^"]+)"', body).group(1)
              ref = f"provider:{addr}@{version}"
              components[ref] = {"type": "library", "bom-ref": ref, "group": addr.rsplit("/", 1)[0],
                                 "name": addr.rsplit("/", 1)[1], "version": version,
                                 "hashes": [{"alg": "SHA-256", "content": h}
                                            for h in sorted(re.findall(r'"zh:([0-9a-f]{64})"', body))]}
          for wf in sorted(glob.glob(".github/workflows/*.y*ml")):
              for action, sha, pin in USES.findall(open(wf).read()):
                  ref = f"action:{action}@{sha}"
                  components[ref] = {"type": "application", "bom-ref": ref, "group": action.split("/")[0],
                                     "name": action.split("/")[1], "version": pin or sha,
                                     "purl": f"pkg:github/{action}@{sha}", "scope": "excluded"}
          bom = {"bomFormat": "CycloneDX", "specVersion": "1.5", "version": 1,
                 "metadata": {"component": {"type": "library", "bom-ref": repo, "group": owner, "name": name,
                                            "version": tag.removeprefix("v"), "purl": f"pkg:github/{repo}@{tag}"}},
                 "components": sorted(components.values(), key=lambda c: c["bom-ref"]),
                 "dependencies": [{"ref": repo, "dependsOn": sorted(r for r in components if r.startswith("provider:"))}]}
          with open("sbom.cdx.json", "w") as f:
              json.dump(bom, f, indent=1)
              f.write("\n")
          print(f"sbom.cdx.json: {len(components)} components")
          PY
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM to release
        if: steps.generate.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" sbom.cdx.json --clobber --repo "$GITHUB_REPOSITORY"
